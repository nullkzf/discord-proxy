name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1

  # Portability check only (the proxy core is plain Go); does not block the Windows build.
  test-portable:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1 -race

  windows:
    name: Windows build, smoke test and installer
    runs-on: windows-latest
    needs: test-windows
    env:
      DP_EMBED_RESOURCES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build DiscordProxy.exe (icon, version info and manifest embedded)
        shell: bash
        run: bash scripts/build-windows.sh "$VERSION"

      - name: Smoke test with a stand-in for Discord, on real Windows
        shell: pwsh
        run: ./scripts/ci-smoke.ps1

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer\DiscordProxy.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Test the installer (install, check, uninstall)
        shell: pwsh
        run: ./scripts/ci-installer.ps1

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\DiscordProxy.exe, README.md, LICENSE -DestinationPath "dist\DiscordProxy-$env:VERSION-portable.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-dist
          path: |
            dist/DiscordProxy-Setup-*.exe
            dist/DiscordProxy-*-portable.zip

  # Manual only (Actions -> Run workflow). GitHub's hosted Mac machines were not available when this was written (jobs were
  # never picked up), so the Mac app is built and tested on a Mac with scripts/build-mac.sh + scripts/smoke-mac.sh and attached to
  # the release by hand. Run this job when Mac capacity is back to get an independent build.
  mac:
    name: Mac build and smoke test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-ci"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build Discord Proxy.app (universal) and the disk image
        run: bash scripts/build-mac.sh "$VERSION"

      - name: Smoke test with a stand-in for Discord
        run: bash scripts/smoke-mac.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-dist
          path: dist/DiscordProxy-*-mac.dmg

  release:
    name: Publish the release (Windows downloads)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Discord Proxy ${GITHUB_REF_NAME#v}" \
            --notes-file RELEASE_NOTES.md --verify-tag
